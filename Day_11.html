}

    font-weight: lighter;
    color: grey;
}

.form-group select{
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
}
input{
    width: 100%;
    padding: 10px;  
    margin-top: 10px;

}

    color: white;
    border-radius: 7px;
    padding: 8px;
    margin-top: 5px;
}

    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#ff5c39;
    color:white;
    padding:12px 18px;
    border-radius:8px;

    <header>

      <h2>SECCAP</h2>
       </div>
    </header>
    <div class="full-page">
    <form action="">
    <div class="card">
      <h3>Check your Attendance</h3>
      <div class="form-group">
      <label for="Olevel">OLevel Student</label>
     <select name="" id="Olevel">
        <option value="yes">Yes</option>
        <option value="no">No</option>
     </select>
</div>
<input type="text" id="cnic" placeholder="CNIC / B-FORM No" required>
<input type="text" id="roll" placeholder="Enter Your Metric Roll No" required>

<button type="button" class="btn" onclick="validateForm()">CHECK</button>
<div id="errorBox"></div>
    </div>
    </div>
    </form>

   <div id="toast" class="toast">
    ⚠ Please fill all fields!
</div>

<script>

function validateForm(){
    let cnic = document.getElementById("cnic").value.trim();
    let roll = document.getElementById("roll").value.trim();
    let toast = document.getElementById("toast");

    if(cnic === "" || roll === ""){
        toast.style.display = "flex";

       
        setTimeout(() => {
            toast.style.display = "none";
        }, 3000);
    }
    else{
        toast.style.display = "none";
        alert("Form submitted successfully!");
    }
}

</script>
